name: Earshot
options:
  bundleIdPrefix: com.umang
  deploymentTarget:
    iOS: "17.0"
targets:
  Earshot:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.umang.earshot
        DEVELOPMENT_TEAM: 6TMMQ8VD2T
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Earshot
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: Earshot listens through your iPhone's microphone so it can tell who you're talking to by their voice.
        NSSpeechRecognitionUsageDescription: Earshot transcribes conversations on your phone to learn names and what people tell you.
        NSLocalNetworkUsageDescription: Earshot talks to its backend running on your Mac.
        # Keeps listening with the screen locked and the phone in your pocket.
        UIBackgroundModes: [audio]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
