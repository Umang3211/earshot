<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Earshot</title>
<style>
/* Rift/Soar language: true-black night canvas, white type in three levels,
   glossy azure primary, glass controls, 24/20/14 radius ladder. */
:root {
  --bg: #000; --panel: #0d0d0d; --raised: #141821; --ink: #fff; --muted: rgba(255,255,255,.72); --faint: rgba(255,255,255,.46);
  --line: rgba(255,255,255,.10); --line-strong: rgba(255,255,255,.16); --accent: #7fa4ff; --accent-soft: rgba(127,164,255,.12);
  --grad-top: #1a2f9e; --grad-bottom: #2f68ff; --warn: #ffb066; --ok: #78e6a0; --pink: #ff8aa0;
  --glass: rgba(20,20,26,.55);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.45 "TWK Lausanne", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(900px 520px at 50% -8%, rgba(47,104,255,.22), transparent 70%),
    radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.6), transparent 60%),
    radial-gradient(1px 1px at 78% 9%, rgba(255,255,255,.5), transparent 60%),
    radial-gradient(1.2px 1.2px at 42% 31%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(1px 1px at 88% 41%, rgba(255,255,255,.4), transparent 60%),
    radial-gradient(1px 1px at 23% 52%, rgba(255,255,255,.3), transparent 60%),
    radial-gradient(1px 1px at 63% 22%, rgba(255,255,255,.45), transparent 60%);
  background-attachment: fixed;
}
header { display: flex; align-items: center; gap: 16px; padding: 16px 24px; }
header h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.04em; }
header .stats { color: var(--faint); font-size: 13px; }
nav { display: flex; gap: 4px; margin-left: auto; padding: 4px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
nav button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px; font-weight: 500; padding: 7px 16px; border-radius: 999px; cursor: pointer; }
nav button.on { background: #fff; color: #000; font-weight: 600; }
main { display: grid; grid-template-columns: 1fr 380px; gap: 16px; padding: 0 16px 16px; height: calc(100% - 70px); }
#mapwrap { position: relative; overflow: hidden; border-radius: 24px; border: 1px solid var(--line); background: rgba(8,8,12,.6); }
canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.legend { position: absolute; left: 16px; bottom: 16px; display: flex; white-space: nowrap; gap: 14px; font-size: 12px; color: var(--muted); background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--line); padding: 8px 14px; border-radius: 999px; }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 6px; }
.empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 24px; pointer-events: none; }
.empty[hidden] { display: none; }
aside { border-radius: 24px; border: 1px solid var(--line); background: rgba(13,13,13,.82); overflow-y: auto; padding: 20px; }
.search { width: 100%; padding: 12px 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--glass); color: var(--ink); font: inherit; margin-bottom: 14px; outline: none; }
.search:focus { border-color: var(--line-strong); }
.search::placeholder { color: var(--faint); }
.row { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 20px; cursor: pointer; border: 1px solid transparent; }
.row:hover, .row.on { background: var(--raised); border-color: var(--line); }
.row b { display: block; font-weight: 600; }
.row span { color: var(--muted); font-size: 13px; }
.av { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 14px; color: #fff; border: 1px solid rgba(255,255,255,.18); }
.av.lg { width: 64px; height: 64px; font-size: 22px; margin-bottom: 14px; }
.k { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); margin: 20px 0 8px; }
.big { font-size: 30px; font-weight: 700; letter-spacing: -0.035em; margin: 0; line-height: 1.1; }
.sub { color: var(--muted); margin: 4px 0 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 14px 16px; }
ul { margin: 0; padding-left: 18px; }
li { margin: 4px 0; }
li::marker { color: var(--accent); }
.said { border-left: 2px solid var(--line-strong); padding: 2px 0 2px 12px; margin: 10px 0; font-size: 14px; color: var(--muted); }
.said small { display: block; color: var(--faint); font-size: 11px; margin-top: 2px; }
.chip { display: inline-block; font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); margin: 0 6px 6px 0; }
.back { border: 0; background: none; color: var(--accent); font: inherit; padding: 0; cursor: pointer; margin-bottom: 14px; }
.ask { display: flex; gap: 8px; }
.ask input { flex: 1; }
.btn, .ask button { border: 1px solid rgba(127,164,255,.6); background: linear-gradient(180deg, var(--grad-top), var(--grad-bottom)); color: #fff; border-radius: 999px; padding: 0 20px; font: inherit; font-weight: 600; cursor: pointer; box-shadow: 0 6px 22px rgba(47,104,255,.45); }
.answer { background: var(--glass); border: 1px solid var(--line); border-radius: 20px; padding: 14px 16px; margin-top: 12px; font-size: 16px; }
.err { color: var(--warn); font-size: 13px; }
body.embed header { display: none; }
body.embed main { height: 100%; padding: 0; gap: 0; }
body.embed #mapwrap, body.embed aside { border-radius: 0; border: 0; }
body.embed aside { border-top: 1px solid var(--line); background: rgba(0,0,0,.6); }
@media (max-width: 760px) {
  header { padding: 14px 16px; flex-wrap: wrap; }
  nav { margin-left: 0; }
  main { grid-template-columns: 1fr; grid-template-rows: 55% 45%; height: calc(100% - 120px); }
  body.embed main { height: 100%; }
  .legend { left: 12px; bottom: 12px; gap: 10px; }
}
</style>
</head>
<body>
<header>
  <h1>earshot</h1>
  <div class="stats" id="stats"></div>
  <nav>
    <button data-tab="people" class="on">People</button>
    <button data-tab="events">Events</button>
    <button data-tab="ask">Ask</button>
  </nav>
</header>
<main>
  <div id="mapwrap">
    <canvas id="map"></canvas>
    <div class="empty" id="empty" hidden>Nobody on the map yet.<br>Start Earshot on your phone and say hi to someone.</div>
    <div class="legend"><span><i style="border-color:rgba(255,255,255,.4)"></i>met</span><span><i style="border-color:var(--accent);border-top-style:dashed"></i>same event</span><span><i style="border-color:var(--ok)"></i>same org</span></div>
  </div>
  <aside id="side"></aside>
</main>
<script>
const qs = new URLSearchParams(location.search);
if (qs.has("embed")) document.body.classList.add("embed");
const API = qs.get("api") || "";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ago = ts => {
  const d = (Date.now() / 1000 - ts) / 86400;
  if (d < 1 / 24) return "just now";
  if (d < 1) return Math.round(d * 24) + "h ago";
  if (d < 30) return Math.round(d) + "d ago";
  return new Date(ts * 1000).toLocaleDateString();
};
const get = p => fetch(API + p).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });

let people = [], sessions = [], tab = "people", selected = null, query = "";

// ---------- map ----------
const cv = $("#map"), ctx = cv.getContext("2d");
let nodes = [], links = [], view = { x: 0, y: 0, k: 1 }, hover = null, dpr = 1;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const hue = s => { let h = 0; for (const c of (s || "").toLowerCase()) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const PAL = [["#2F68FF","#1A2F9E"],["#7FA4FF","#5069F2"],["#FF8AA0","#A855F7"],["#78E6A0","#0AA15A"],["#FFB066","#CF4444"],["#A3B3F8","#6366F1"]];
const palFor = name => { let h = 0; for (const c of name || "") h = (h * 31 + c.codePointAt(0)) | 0; return PAL[Math.abs(h) % PAL.length]; };  // same hash as the app's Monogram
const initials = n => (n || "?").split(" ").slice(0, 2).map(w => w[0]).join("").toUpperCase();
const avatar = (n, cls = "") => { const [a, b] = palFor(n); return `<div class="av ${cls}" style="background:linear-gradient(135deg,${a},${b})">${esc(initials(n))}</div>`; };

function size() {
  dpr = window.devicePixelRatio || 1;
  cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr;
}
function radius(n) { return n.kind === "me" ? 18 : 12 + Math.min(8, (n.times_met || 1) * 2); }

function setGraph(g) {
  const old = Object.fromEntries(nodes.map(n => [n.id, n]));
  nodes = g.nodes.map((n, i) => {
    const o = old[n.id];
    const a = i * 2.4, r = 120 + 30 * Math.sqrt(i);
    return Object.assign(n, o ? { x: o.x, y: o.y, vx: 0, vy: 0 } : { x: Math.cos(a) * r, y: Math.sin(a) * r, vx: 0, vy: 0 });
  });
  const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  links = g.links.map(l => ({ ...l, s: byId[l.source], t: byId[l.target] })).filter(l => l.s && l.t);
  const me = byId.me; if (me) { me.x = 0; me.y = 0; }
  $("#empty").hidden = nodes.length > 1;
  heat = 1;
}

let heat = 1;
function step() {
  if (heat < 0.002) return;
  for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
    const a = nodes[i], b = nodes[j];
    let dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy + 0.01;
    const f = 2600 / d2, d = Math.sqrt(d2);
    dx /= d; dy /= d;
    a.vx -= dx * f; a.vy -= dy * f; b.vx += dx * f; b.vy += dy * f;
  }
  for (const l of links) {
    const want = l.kind === "met" ? 150 : l.kind === "same_org" ? 60 : 95;
    const k = l.kind === "met" ? 0.012 : 0.03;
    let dx = l.t.x - l.s.x, dy = l.t.y - l.s.y, d = Math.hypot(dx, dy) || 1;
    const f = (d - want) * k;
    dx /= d; dy /= d;
    l.s.vx += dx * f; l.s.vy += dy * f; l.t.vx -= dx * f; l.t.vy -= dy * f;
  }
  for (const n of nodes) {
    if (n.kind === "me" || n === drag) { n.vx = n.vy = 0; continue; }
    n.vx -= n.x * 0.002; n.vy -= n.y * 0.002;
    n.vx *= 0.82; n.vy *= 0.82;
    n.x += n.vx * heat; n.y += n.vy * heat;
  }
  heat *= 0.992;
}

let userMoved = false;
function fit() {
  if (userMoved || nodes.length < 2) return;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of nodes) { const r = radius(n) + 40; x0 = Math.min(x0, n.x - r); y0 = Math.min(y0, n.y - r); x1 = Math.max(x1, n.x + r); y1 = Math.max(y1, n.y + r); }
  const w = cv.clientWidth, h = cv.clientHeight - 60;
  const k = Math.max(0.3, Math.min(1.6, w / (x1 - x0), h / (y1 - y0)));
  view.k += (k - view.k) * 0.1;
  view.x += (-(x0 + x1) / 2 * view.k - view.x) * 0.1;
  view.y += (-(y0 + y1) / 2 * view.k - 30 - view.y) * 0.1;
}
function draw() {
  step(); fit();
  const w = cv.width, h = cv.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.setTransform(dpr * view.k, 0, 0, dpr * view.k, w / 2 + view.x * dpr, h / 2 + view.y * dpr);
  const focus = selected || (hover && hover.id);
  const near = new Set();
  if (focus) { near.add(focus); for (const l of links) { if (l.s.id === focus) near.add(l.t.id); if (l.t.id === focus) near.add(l.s.id); } }
  for (const l of links) {
    const dim = focus && !(near.has(l.s.id) && near.has(l.t.id) && (l.s.id === focus || l.t.id === focus));
    ctx.globalAlpha = dim ? 0.12 : l.kind === "met" ? 0.55 : 0.85;
    ctx.strokeStyle = l.kind === "met" ? "rgba(255,255,255,.28)" : l.kind === "same_org" ? css("--ok") : css("--accent");
    ctx.lineWidth = (l.kind === "met" ? 1 : 1.6) * Math.min(3, l.weight || 1) / view.k ** 0.3;
    ctx.setLineDash(l.kind === "same_event" ? [5, 4] : []);
    ctx.beginPath(); ctx.moveTo(l.s.x, l.s.y); ctx.lineTo(l.t.x, l.t.y); ctx.stroke();
  }
  ctx.setLineDash([]);
  for (const n of nodes) {
    const r = radius(n), dim = focus && !near.has(n.id);
    ctx.globalAlpha = dim ? 0.25 : 1;
    ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 7);
    const [ga, gb] = n.kind === "me" ? ["#FFFFFF", "#7A808C"] : palFor(n.name);
    const g = ctx.createLinearGradient(n.x - r, n.y - r, n.x + r, n.y + r);
    g.addColorStop(0, ga); g.addColorStop(1, gb);
    if (n.kind === "me") { ctx.shadowColor = "rgba(255,255,255,.45)"; ctx.shadowBlur = 22; }
    ctx.fillStyle = g; ctx.fill(); ctx.shadowBlur = 0;
    ctx.lineWidth = 1; ctx.strokeStyle = "rgba(255,255,255,.22)"; ctx.stroke();
    if (n.kind === "person" && r >= 10) {
      ctx.fillStyle = "#fff"; ctx.font = `600 ${Math.round(r * 0.8)}px -apple-system, system-ui, sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(initials(n.name), n.x, n.y + 0.5); ctx.textBaseline = "alphabetic";
    }
    if (n.id === selected || n === hover) { ctx.beginPath(); ctx.arc(n.x, n.y, r + 4, 0, 7); ctx.lineWidth = 2; ctx.strokeStyle = "rgba(127,164,255,.9)"; ctx.stroke(); }
    if (n.followups) { ctx.beginPath(); ctx.arc(n.x + r * 0.75, n.y - r * 0.75, 3.5, 0, 7); ctx.fillStyle = css("--warn"); ctx.fill(); }
    ctx.fillStyle = css("--ink");
    ctx.font = `${n.kind === "me" ? 700 : 500} ${12 / Math.min(1.4, view.k) ** 0.5}px -apple-system, system-ui, sans-serif`;
    ctx.textAlign = "center";
    ctx.fillText(n.name, n.x, n.y + r + 14);
    if (n.org && view.k > 0.8 && !dim) {
      ctx.fillStyle = css("--muted"); ctx.font = `11px -apple-system, system-ui, sans-serif`;
      ctx.fillText(n.org, n.x, n.y + r + 27);
    }
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(draw);
}

function toWorld(e) {
  const b = cv.getBoundingClientRect();
  return { x: (e.clientX - b.left - b.width / 2 - view.x) / view.k, y: (e.clientY - b.top - b.height / 2 - view.y) / view.k };
}
function hit(p) { return nodes.find(n => Math.hypot(n.x - p.x, n.y - p.y) < radius(n) + 6); }
let drag = null, pan = null, moved = false, pointers = new Map(), pinch = null;
cv.addEventListener("pointerdown", e => {
  cv.setPointerCapture(e.pointerId); pointers.set(e.pointerId, e); moved = false;
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), k: view.k }; drag = pan = null; return; }
  const n = hit(toWorld(e));
  if (n && n.kind !== "me") drag = n; else pan = { x: e.clientX - view.x, y: e.clientY - view.y };
});
cv.addEventListener("pointermove", e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, e);
  if (pinch && pointers.size === 2) { const [a, b] = [...pointers.values()]; view.k = Math.max(0.3, Math.min(3, pinch.k * Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) / pinch.d)); return; }
  if (drag) { const p = toWorld(e); drag.x = p.x; drag.y = p.y; heat = Math.max(heat, 0.3); moved = true; return; }
  if (pan) { view.x = e.clientX - pan.x; view.y = e.clientY - pan.y; moved = true; userMoved = true; return; }
  const n = hit(toWorld(e)); hover = n || null; cv.style.cursor = n ? "pointer" : "grab";
});
cv.addEventListener("pointerup", e => {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!moved) { const n = hit(toWorld(e)); if (n && n.kind === "person") openPerson(n.id); else if (!n) { selected = null; render(); } }
  drag = pan = null;
});
cv.addEventListener("wheel", e => { e.preventDefault(); view.k = Math.max(0.3, Math.min(3, view.k * Math.exp(-e.deltaY * 0.0015))); userMoved = true; }, { passive: false });
addEventListener("resize", size);

// ---------- side panel ----------
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  tab = b.dataset.tab; selected = null;
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  render();
});

async function openPerson(id) {
  selected = id;
  const side = $("#side");
  try {
    const p = await get(`/people/${id}`);
    if (selected !== id) return;
    side.innerHTML = `
      <button class="back" onclick="selected=null;render()">‹ All people</button>
      ${avatar(p.name, "lg")}
      <p class="big">${esc(p.name)}</p>
      <p class="sub">${esc([p.role, p.org].filter(Boolean).join(" at ") || "No details yet")}</p>
      <div class="k">Met</div>
      <div>${p.times_met}× · first ${ago(p.first_met)} · last ${ago(p.last_seen)}</div>
      <div>${p.has_voice ? `<span class="chip">voiceprint · ${p.voice_samples} samples</span>` : `<span class="chip">no voiceprint</span>`}</div>
      ${p.followups.length ? `<div class="k">Follow up</div><div class="card"><ul>${p.followups.map(f => `<li>${esc(f)}</li>`).join("")}</ul></div>` : ""}
      ${p.facts.length ? `<div class="k">Remember</div><div class="card"><ul>${p.facts.map(f => `<li>${esc(f)}</li>`).join("")}</ul></div>` : ""}
      ${p.said.length ? `<div class="k">What they said</div>${p.said.map(s => `<div class="said">${esc(s.text)}<small>${ago(s.ts)}</small></div>`).join("")}` : ""}`;
  } catch (e) { side.innerHTML = `<p class="err">Couldn't load that person.</p>`; }
}

function render() {
  const side = $("#side");
  if (selected) return openPerson(selected);
  if (tab === "people") {
    const q = query.toLowerCase();
    const list = people.filter(p => !q || [p.name, p.role, p.org, ...p.facts].join(" ").toLowerCase().includes(q));
    side.innerHTML = `<input class="search" placeholder="Search people, orgs, notes" value="${esc(query)}" oninput="query=this.value;render();this.focus();this.setSelectionRange(this.value.length,this.value.length)">
      ${list.map(p => `<div class="row" onclick="openPerson('${p.id}')">${avatar(p.name)}<div><b>${esc(p.name)}</b><span>${esc([p.role, p.org].filter(Boolean).join(" at ") || "No details yet")} · ${ago(p.last_seen)}</span></div></div>`).join("") || `<p class="sub">No one yet.</p>`}`;
    if (q) { const s = side.querySelector(".search"); s.focus(); }
  } else if (tab === "events") {
    side.innerHTML = sessions.map(s => `<div class="row"><b>${new Date(s.started * 1000).toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}</b>
      <span>${s.turns} turns · ${s.people.length} ${s.people.length === 1 ? "person" : "people"}</span>
      <div style="margin-top:6px">${s.people.map(p => `<span class="chip" style="cursor:pointer" onclick="event.stopPropagation();openPerson('${p.id}')">${esc(p.name)}</span>`).join("")}</div></div>`).join("") || `<p class="sub">No events yet.</p>`;
  } else {
    side.innerHTML = `<div class="ask"><input class="search" style="margin:0" id="q" placeholder="Who was hiring interns?"><button onclick="ask()">Ask</button></div><div id="ans"></div>`;
    $("#q").onkeydown = e => { if (e.key === "Enter") ask(); };
  }
}

async function ask() {
  const q = $("#q").value.trim(); if (!q) return;
  $("#ans").innerHTML = `<div class="answer">Thinking…</div>`;
  try {
    const r = await fetch(API + "/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: q }) }).then(r => r.json());
    $("#ans").innerHTML = `<div class="answer">${esc(r.answer)}</div>`;
  } catch { $("#ans").innerHTML = `<p class="err">Backend unreachable.</p>`; }
}

async function refresh() {
  try {
    const [g, p, s, h] = await Promise.all([get("/graph"), get("/people"), get("/sessions"), get("/health")]);
    const sig = JSON.stringify([g.nodes.map(n => n.id + n.times_met + n.org), g.links.length]);
    if (sig !== refresh.sig) { setGraph(g); refresh.sig = sig; }
    const changed = JSON.stringify(p) !== JSON.stringify(people) || s.length !== sessions.length;
    people = p; sessions = s;
    $("#stats").textContent = `${p.length} ${p.length === 1 ? "person" : "people"} · ${s.length} events${h.wearer_enrolled ? "" : " · your voice not recorded yet"}`;
    if (changed && !(tab === "ask")) render();
  } catch { $("#stats").textContent = "backend unreachable"; }
}

size(); render(); refresh(); setInterval(refresh, 4000); requestAnimationFrame(draw);
</script>
</body>
</html>
